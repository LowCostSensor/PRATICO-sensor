# Build the package and upload it to PyPI when a GitHub release is published.
# Trusted publishing: PyPI trusts this workflow (pending publisher: pratico-sensor / publish.yml / pypi),
# so no token is stored anywhere. The "pypi" environment asks a reviewer to approve the upload.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:        # manual run: build and check only, no upload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Tag matches firmware version
        if: github.event_name == 'release'
        run: |
          v=$(grep -Po '^VERSION = "\K[^"]+' firmware/pratico3_core.py)
          echo "tag ${GITHUB_REF_NAME}  firmware ${v}"
          test "${GITHUB_REF_NAME#v}" = "$v"
      - name: Smoke test
        run: |
          python -m pip install dist/*.whl
          pratico-selftest --simulate
          pratico-selftest --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pratico-sensor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
